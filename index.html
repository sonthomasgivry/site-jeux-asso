<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggestions de Jeux</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎲 Boîte à idées - Achats</h1>
        <button class="btn-suggerer">+ Suggérer un jeu</button>
    </header>

    <main class="grille-jeux">
        <!-- Première carte de jeu d'exemple -->
        <article class="carte-jeu">
            <img src="https://images.unsplash.com/photo-1610890716171-6b1bb98ffaed?q=80&w=900&auto=format&fit=crop" alt="Jeu de plateau" class="image-jeu">
            <div class="contenu-carte">
                <h2>Catan</h2>
                <p class="details">👥 3-4 joueurs | ⏳ 60-120 min</p>
                <p class="argument">Un classique incontournable pour nos soirées du vendredi !</p>
                <button class="btn-vote">
                    ▲ Pour <span class="compteur">12</span>
                </button>
            </div>
        </article>
        
        <!-- Deuxième carte de jeu d'exemple -->
        <article class="carte-jeu">
            <img src="https://images.unsplash.com/photo-1632501641765-e568d28b0015?q=80&w=900&auto=format&fit=crop" alt="Cartes de jeu" class="image-jeu">
            <div class="contenu-carte">
                <h2>7 Wonders</h2>
                <p class="details">👥 2-7 joueurs | ⏳ 30 min</p>
                <p class="argument">Parfait quand on est nombreux autour de la table.</p>
                <button class="btn-vote">
                    ▲ Pour <span class="compteur">8</span>
                </button>
            </div>
        </article>
    </main>
<!-- Connexion au fichier JavaScript -->
    <script src="script.js"></script>
</body>
</html>
</body>
</html>
